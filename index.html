    .bg::before{content:"";position:absolute;inset:0;opacity:0.025;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .page{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 2rem;text-align:center}
    .bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.4rem 2.5rem;z-index:10;opacity:0;animation:fadeD 1s ease 2.2s forwards;transition:background 0.4s ease,backdrop-filter 0.4s ease}
    .bar.is-scrolled{background:rgba(10,10,20,0.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .bar span{font-family:"Cormorant Garamond",Georgia,serif;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(255,255,255,0.65)}
    .dot-g{color:#D4A84B}
    .logo-wrap{width:min(660px,88vw);opacity:0;animation:riseIn 2s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;filter:drop-shadow(0 2px 48px rgba(212,168,75,0.30)) drop-shadow(0 1px 12px rgba(0,0,0,0.5))}
    .logo-wrap img{width:100%;height:auto;display:block}
    .rule{width:0;height:0.5px;background:linear-gradient(to right,transparent,#D4A84B,transparent);margin:1.8rem auto 0;animation:drawL 1.4s ease 1.5s forwards}
    .tagline{margin-top:1.5rem;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(12px,2vw,15px);letter-spacing:0.34em;text-transform:uppercase;color:#FFFFFF;opacity:0;font-weight:400;text-shadow:0 1px 12px rgba(0,0,0,0.6);animation:fadeU 1s ease 1.8s forwards}
    .tagline .sep{color:#D4A84B;margin:0 0.25em}
    .issue{margin-top:0.65rem;font-family:"Cormorant Garamond",Georgia,serif;font-size:13px;font-style:italic;letter-spacing:0.14em;color:rgba(255,255,255,0.7);text-shadow:0 1px 8px rgba(0,0,0,0.5);opacity:0;animation:fadeU 1s ease 2s forwards}
    .notify{margin-top:2.8rem;display:flex;flex-direction:column;align-items:center;gap:0.55rem;opacity:0;animation:fadeU 1s ease 2.2s forwards}
    .notify label{font-family:"Cormorant Garamond",Georgia,serif;font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:rgba(255,255,255,0.45)}
    .nrow{display:flex;align-items:center;gap:12px;border-bottom:0.5px solid rgba(212,168,75,0.45);padding-bottom:7px}
    .nrow input{background:transparent;border:none;outline:none;font-family:"Cormorant Garamond",Georgia,serif;font-size:15px;color:#FFFFFF;width:210px;letter-spacing:0.05em}
    .nrow input::placeholder{color:rgba(255,255,255,0.3);font-style:italic}
    .nrow button{background:none;border:none;cursor:pointer;color:#D4A84B;font-size:17px;opacity:0.75;transition:opacity 0.2s,transform 0.2s;padding:0;line-height:1}
    .nrow button:hover{opacity:1;transform:translateX(3px)}
    .conf{font-family:"Cormorant Garamond",Georgia,serif;font-size:13px;font-style:italic;color:#D4A84B;min-height:20px;letter-spacing:0.05em}
    .footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:1.3rem 2.5rem;z-index:10;opacity:0;animation:fadeU 1s ease 2.5s forwards}
    .footer span{font-family:"Cormorant Garamond",Georgia,serif;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.35)}
    @keyframes riseIn{from{opacity:0;transform:translateY(16px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes fadeU{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeD{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes drawL{from{width:0;opacity:0}to{width:min(380px,55vw);opacity:1}}
    @keyframes kenBurns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1.5%,1%)}}
    @media(max-width:600px){.bar,.footer{padding:1.1rem 1.4rem}.nrow input{width:160px}.tagline{letter-spacing:0.2em}}
  </style>
